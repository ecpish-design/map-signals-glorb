function collectSupportCards(){const map=new Map();Object.values(state.maps).forEach(m=>{['self','others'].forEach(sec=>responseItems(m,sec).forEach(x=>{const key=sec+'-'+x.asset;const old=map.get(key)||{...x,type:sec,tags:[]};if(m.signal!=='custom'&&!old.tags.includes(m.signal))old.tags.push(m.signal);old.emotion=old.emotion||m.emotion.label;map.set(key,old)}));if(m.otherHelp){const key='text-'+m.otherHelp;const old=map.get(key)||{asset:null,label:m.otherHelp,type:'self',tags:[]};if(m.signal!=='custom'&&!old.tags.includes(m.signal))old.tags.push(m.signal);map.set(key,old)}});recoveryItems('recoveryHelp').forEach(x=>map.set('recovery-'+x.asset,{...x,type:'self',tags:['recovery']}));return [...map.values()]}
function supportCard(c){return `<div class="support-card">${c.asset?img(c.asset,c.label):'<div class="text-support">＋</div>'}<div class="label">${esc(c.label)}</div><div class="tags">${c.tags.map(t=>`<span class="tag">${esc((SIGNALS[t]?.label||t))}</span>`).join('')}</div></div>`}
function renderSupportCards(){const cards=collectSupportCards(),self=cards.filter(c=>c.type==='self'),other=cards.filter(c=>c.type==='others');const one=state.mode==='one'?Object.values(state.maps)[0]:null;app.innerHTML=`<div class="support-page"><div class="report-actions no-print"><button class="btn primary" onclick="printCards()">PRINT SUPPORT MENU</button><button class="btn secondary" onclick="viewReport()">VIEW REPORT</button><button class="btn secondary" onclick="returnFromOutput()">← BACK</button></div><section class="support-sheet"><div class="eyebrow">CUT-OUT SUPPORT RESOURCE</div><h1>${esc(state.name)}'S ${one?'SUPPORT CARDS FOR '+one.emotion.label.toUpperCase():'SUPPORT MENU'}</h1><p class="lead" style="font-size:20px">These are the things ${esc(state.name)} identified as helpful. Cut around the dashed lines and keep the cards somewhere easy to use.</p><div class="support-section"><h2>THINGS I CAN DO</h2>${self.length?`<div class="support-cards">${self.map(supportCard).join('')}</div>`:'<div class="empty-note">No self-support cards were selected yet.</div>'}</div><div class="support-section"><h2>THINGS SOMEONE ELSE CAN DO</h2>${other.length?`<div class="support-cards">${other.map(supportCard).join('')}</div>`:'<div class="empty-note">No other-person support cards were selected yet.</div>'}</div></section></div>`;state.screen='cards';save()}
function viewCards(){state.returnScreen=state.screen;state.screen='cards';render()}
function printReport(){if(state.screen!=='report')state.returnScreen=state.screen;state.screen='report';render();document.getElementById('pageStyle').textContent='@page{size:A4 landscape;margin:8mm}';document.body.classList.add('print-report');setTimeout(()=>{window.print();document.body.classList.remove('print-report');},250)}
function printCards(){if(state.screen!=='cards')state.returnScreen=state.screen;state.screen='cards';render();document.getElementById('pageStyle').textContent='@page{size:A4 portrait;margin:8mm}';document.body.classList.add('print-cards');setTimeout(()=>{window.print();document.body.classList.remove('print-cards');},250)}
function buildTextReport(){let t=`${state.name}'s Signal Map & Support Plan\n\n`;SIGNAL_ORDER.forEach(s=>{const m=Object.values(state.maps).find(x=>x.signal===s&&x.completed);if(!m){t+=`${SIGNALS[s].label}: Not completed this session.\n\n`;return}t+=`${SIGNALS[s].label} — ${m.emotion.label}\n`;[['Signs','body'],['May want to','action'],['Makes it harder','harder'],['Helps self','self'],['Others can help','others']].forEach(([h,sec])=>{const xs=responseItems(m,sec);if(xs.length)t+=`${h}: ${xs.map(x=>x.label).join(', ')}\n`});if(m.otherHelp)t+=`Other support: ${m.otherHelp}\n`;if(m.important)t+=`Important note: ${m.important}\n`;t+='\n'});const u=allUnknown();if(u.supports.length)t+=`Supports unknown or untried: ${u.supports.map(x=>x.label).join(', ')}\n`;return t}
async function fileToDataURL(url){const b=await fetch(url).then(r=>r.blob());return await new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.onerror=reject;fr.readAsDataURL(b)})}
async function buildVisualReportFile(){const originalScreen=state.screen,originalReturn=state.returnScreen;state.screen='report';renderReport();const sheet=document.querySelector('.report-sheet').cloneNode(true);for(const im of [...sheet.querySelectorAll('img')]){try{im.src=await fileToDataURL(im.src)}catch(e){}}let css='';try{css=[...document.styleSheets].flatMap(ss=>{try{return [...ss.cssRules].map(r=>r.cssText)}catch(e){return[]}}).join('\n')}catch(e){}const html=`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(state.name)}'s Signal Map</title><style>${css}</style></head><body style="background:#f7f2e9;padding:24px">${sheet.outerHTML}</body></html>`;state.screen=originalScreen;state.returnScreen=originalReturn;if(originalScreen!=='report')render();const safe=(state.name||'student').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'');return new File([html],`${safe}-signal-map.html`,{type:'text/html'})}
async function shareReport(){const text=buildTextReport();try{if(navigator.share&&navigator.canShare){const file=await buildVisualReportFile();if(navigator.canShare({files:[file]})){await navigator.share({title:`${state.name}'s Signal Map`,text:'Signal Map & Support Plan',files:[file]});return}}if(navigator.share){await navigator.share({title:`${state.name}'s Signal Map`,text});return}}catch(e){if(e.name==='AbortError')return}const subject=encodeURIComponent(`${state.name}'s Signal Map & Support Plan`),body=encodeURIComponent(text.slice(0,12000));window.location.href=`mailto:?subject=${subject}&body=${body}`}
function saveSummaryImage(){const c=document.createElement('canvas');c.width=1600;c.height=2000;const x=c.getContext('2d');x.fillStyle='#f4ede1';x.fillRect(0,0,c.width,c.height);x.fillStyle='#0d1d32';x.font='bold 68px Arial';x.fillText(`${state.name.toUpperCase()}'S SIGNAL MAP`,90,120);x.font='28px Arial';x.fillText('Student-identified support summary',90,175);let y=260;SIGNAL_ORDER.forEach(s=>{const m=Object.values(state.maps).find(v=>v.signal===s&&v.completed);x.fillStyle={low:'#dbe8f5',steady:'#dcefeb',rising:'#f7e1c5',overload:'#f3d8df'}[s];x.fillRect(80,y,1440,300);x.fillStyle='#0d1d32';x.font='bold 30px Arial';x.fillText(SIGNALS[s].label,115,y+50);x.font='bold 40px Arial';x.fillText(m?m.emotion.label:'Not completed',115,y+100);if(m){const help=[...responseItems(m,'self'),...responseItems(m,'others')].map(v=>v.label).slice(0,6);x.font='24px Arial';wrapCanvas(x,'Helps: '+(help.join(' • ')||'Not identified yet'),115,y+150,1330,33)}y+=335});x.fillStyle='#0d1d32';x.font='22px Arial';wrapCanvas(x,'This is a student-identified summary. View the full report for signs, escalation pathway, unknown/untried supports and recovery information.',90,1660,1400,32);const a=document.createElement('a');a.download=`${(state.name||'student').replace(/\s+/g,'-')}-signal-map.png`;a.href=c.toDataURL('image/png');a.click()}
function wrapCanvas(ctx,text,x,y,maxWidth,lineHeight){const words=text.split(' ');let line='';for(let i=0;i<words.length;i++){const test=line+words[i]+' ';if(ctx.measureText(test).width>maxWidth&&i>0){ctx.fillText(line,x,y);line=words[i]+' ';y+=lineHeight}else line=test}ctx.fillText(line,x,y)}
function showExit(){modalRoot.innerHTML=`<div class="modal-back"><div class="modal"><div class="eyebrow">BEFORE YOU GO</div><h2>KEEP WHAT YOU HAVE MAPPED</h2><p>Your answers are stored only in this browser tab. If you close it, your progress can be lost.</p><p>If you are finished for now, make a report from everything you have completed so far.</p><div class="btn-row"><button class="btn primary" onclick="closeModal();viewReport()">VIEW REPORT SO FAR</button><button class="btn secondary" onclick="closeModal();printReport()">PRINT / SAVE</button><button class="btn secondary" onclick="closeModal();shareReport()">SEND REPORT</button><button class="btn ghost" onclick="closeModal()">KEEP WORKING</button></div></div></div>`}
function showReset(){if(!hasProgress()){resetState();return}modalRoot.innerHTML=`<div class="modal-back"><div class="modal"><div class="eyebrow">START OVER</div><h2>THIS WILL CLEAR YOUR MAP</h2><p>If you start over, the answers in this session will be removed. Print, save or send a report first if you want to keep them.</p><div class="btn-row"><button class="btn primary" onclick="closeModal();viewReport()">VIEW / SAVE REPORT FIRST</button><button class="btn secondary" onclick="closeModal();resetState()">CLEAR AND START OVER</button><button class="btn ghost" onclick="closeModal()">CANCEL</button></div></div></div>`}
function closeModal(){modalRoot.innerHTML=''}
function goBack(){const m=currentMap();if(state.screen==='question'){if(state.itemIndex>0){state.itemIndex--;render();return}state.screen='sectionIntro';render();return}if(state.screen==='sectionIntro'&&m){if(state.sectionIndex>0){state.sectionIndex--;const secs=getSections(m.signal,m.emotion);state.itemIndex=Math.max(0,secs[state.sectionIndex].items.length-1);state.screen='question';render();return}state.screen=state.mode==='one'?'oneSelect':'signalSelect';render();return}if(state.screen==='notes1'&&m){const secs=getSections(m.signal,m.emotion);state.sectionIndex=secs.length-1;state.itemIndex=secs[state.sectionIndex].items.length-1;state.screen='question';render();return}if(state.screen==='notes2'){state.screen='notes1';render();return}if(state.screen==='checkpoint'){state.screen='notes2';render();return}if(state.screen==='customEmotion'){state.screen=state.mode==='one'?'oneSelect':'signalSelect';render();return}if(state.screen==='signalSelect'){if(state.currentSignal==='low'){state.screen='mode'}else{const i=SIGNAL_ORDER.indexOf(state.currentSignal);state.currentSignal=SIGNAL_ORDER[Math.max(0,i-1)];state.screen='checkpoint';state.currentKey=state.currentSignal;state.emotion=state.maps[state.currentSignal]?.emotion||null}render();return}if(state.screen==='oneSelect'){state.screen='mode';render();return}if(state.screen==='mode'){state.screen='name';render();return}if(state.screen==='name'){state.screen='intro';render();return}if(state.screen==='recoveryQuestion'){if(state.recoveryItem>0){state.recoveryItem--;render();return}state.screen='recoveryIntro';render();return}if(state.screen==='recoveryIntro'){if(state.recoverySection>0){state.recoverySection--;state.recoveryItem=RECOVERY_SECTIONS[state.recoverySection].items.length-1;state.screen='recoveryQuestion'}else{state.currentSignal='overload';state.currentKey='overload';state.emotion=state.maps.overload?.emotion;state.screen='checkpoint'}render();return}if(['report','cards','final'].includes(state.screen)){state.screen='final';render();return}}
backBtn.addEventListener('click',goBack);exitBtn.addEventListener('click',showExit);resetBtn.addEventListener('click',showReset);readBtn.addEventListener('click',()=>{if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const text=app.innerText.replace(/\s+/g,' ').trim();const u=new SpeechSynthesisUtterance(text);u.rate=.95;window.speechSynthesis.speak(u)});
window.addEventListener('beforeunload',e=>{if(hasProgress()&&!state.finalized){e.preventDefault();e.returnValue=''}});
render();
</script>
</body>
